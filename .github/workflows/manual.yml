name: Sedstart QA

on:
  workflow_dispatch:

jobs:
  sedstart-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SedStart test run
        uses: sedstart/runcloud@main
        with:
          api_key: ${{ secrets.SEDSTART_API_KEY_QA }}
          project_id: 660
          test_id: 4126
          profile_id: 1170
          browser: chrome
          headless: false
          environment: 'QA'

      
